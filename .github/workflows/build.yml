name: Build TrollVNC

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      is_managed:
        type: boolean
        description: Build with a bundled Managed.plist (managed configuration)
        required: false
        default: true
      desktop_name:
        type: string
        description: Desktop name shown to clients
        required: false
        default: iPhone6s
      port:
        type: string
        description: VNC TCP port (ignored in reverse/repeater mode)
        required: false
        default: "5901"
      view_only:
        type: boolean
        description: Global view-only (ignore input)
        required: false
        default: false
      scale:
        type: string
        description: Output scale (0.1–1.0); start at native resolution
        required: false
        default: "1.0"
      frame_rate_spec:
        type: string
        description: Frame rate spec; 30 fps is a conservative A9 starting point
        required: false
        default: "30"
      modifier_map:
        type: choice
        description: Modifier mapping
        required: false
        default: std
        options:
          - std
          - altcmd
      reverse_mode:
        type: choice
        description: Reverse connection mode
        required: false
        default: repeater
        options:
          - none
          - viewer
          - repeater
      reverse_socket:
        type: string
        description: Repeater server-side endpoint
        required: false
        default: "8.146.199.93:5500"
      reverse_repeater_id:
        type: string
        description: Repeater ID (numeric)
        required: false
        default: "554429985"

env:
  FINALPACKAGE: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  build:
    runs-on: macos-15

    strategy:
      matrix:
        # This deployment targets RootHide Dopamine; avoid building unrelated schemes.
        scheme: ["roothide"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # ldid signs the iOS binaries; p7zip packages artifacts.
          brew install ldid-procursus p7zip make

      - name: Checkout roothide/theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive

      - name: Install iOS SDKs
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos-roothide
          cd theos-roothide
          ./bin/install-sdk iPhoneOS16.5
          ./bin/install-sdk iPhoneOS14.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Generate Managed.plist (managed build)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.is_managed == true }}
        env:
          TVNC_DESKTOP_NAME: ${{ inputs.desktop_name }}
          TVNC_PORT: ${{ inputs.port }}
          TVNC_VIEW_ONLY: ${{ inputs.view_only }}
          TVNC_SCALE: ${{ inputs.scale }}
          TVNC_FRAME_RATE_SPEC: ${{ inputs.frame_rate_spec }}
          TVNC_MODIFIER_MAP: ${{ inputs.modifier_map }}
          TVNC_REVERSE_MODE: ${{ inputs.reverse_mode }}
          TVNC_REVERSE_SOCKET: ${{ inputs.reverse_socket }}
          TVNC_REVERSE_REPEATER_ID: ${{ inputs.reverse_repeater_id }}
          TVNC_ENABLED: true
          TVNC_CLIPBOARD_ENABLED: true
          TVNC_SINGLE_NOTIF_ENABLED: true
          TVNC_CLIENT_NOTIFS_ENABLED: true
          TVNC_KEEPALIVE_SEC: 60
          TVNC_LAUNCH_AT_LOGIN: true
          TVNC_ORIENTATION_SYNC: true
          TVNC_NATURAL_SCROLL: false
          TVNC_AUTO_ASSIST_ENABLED: false
          TVNC_SERVER_CURSOR: false
          TVNC_BONJOUR_ENABLED: false
          TVNC_KEY_LOGGING: false
          TVNC_FULL_PASSWORD: ${{ secrets.TVNC_FULL_PASSWORD }}
          TVNC_VIEWONLY_PASSWORD: ${{ secrets.TVNC_VIEWONLY_PASSWORD }}
        run: |
          if [[ -z "${TVNC_FULL_PASSWORD:-}" ]]; then
            echo "::error::Set the TVNC_FULL_PASSWORD repository secret before building a public Repeater deployment."
            exit 1
          fi
          bash devkit/gen-managed-plist.sh

      - name: Build package (RootHide)
        run: |
          source devkit/roothide.sh
          FINALPACKAGE=1 TARGET_XCPRETTY= gmake clean package

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/dsym-roothide
          mkdir -p artifacts/packages-roothide
          if [ -d ".theos/obj" ]; then
            find .theos/obj -name "*.dSYM" -exec cp -r {} artifacts/dsym-roothide/ \;
          fi
          if [ -d "packages" ]; then
            cp -r packages/*.deb artifacts/packages-roothide/
          fi

      - name: Upload dSYM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsym-roothide
          path: artifacts/dsym-roothide
          if-no-files-found: warn

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-roothide
          path: artifacts/packages-roothide
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: build
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download RootHide package artifact
        uses: actions/download-artifact@v4
        with:
          name: packages-roothide
          path: release-packages

      - name: Create release tag
        id: tag
        run: |
          PACKAGE_VERSION=$(grep 'PACKAGE_VERSION' Makefile | cut -d' ' -f4)
          TAG_NAME="v${PACKAGE_VERSION}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Release ${{ steps.tag.outputs.tag_name }}
          body_path: CHANGELOG.md
          files: release-packages/**/*
          draft: false
          prerelease: false
